name: Core regression tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / ${{ matrix.timezone }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "20"
            timezone: Asia/Seoul
          - os: ubuntu-latest
            node: "22"
            timezone: UTC
          - os: ubuntu-latest
            node: "24"
            timezone: America/Los_Angeles
          - os: windows-latest
            node: "22"
            timezone: UTC
          - os: windows-latest
            node: "24"
            timezone: Asia/Seoul
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run CLI and source tests with coverage gates
        run: npm run test:coverage
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-node${{ matrix.node }}-${{ strategy.job-index }}
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7
